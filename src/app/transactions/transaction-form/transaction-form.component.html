<form [formGroup]="formTrasaction">
    <div class="card flex justify-content-center">
        <p-dialog header="Header" [(visible)]="dialogVisible" [modal]="true" maskStyleClass="blur"  closable="false"
            [breakpoints]="{ '699px': '75vw', '875px': '90vw' }" [style]="{ width: '30vw' }" [draggable]="false">
            <ng-template pTemplate="header">
                <div class=" align-items-center justify-content-center gap-2">
                    <h3 class="text-3xl my-2  ">Adicionar Transação</h3>
                    <span class="p-text-secondary block ">Insira as informações abaixo.</span>
                </div>
            </ng-template>

            <div class="mt-3">
                <div class="field">
                    <label for="titulo">Título</label>
                    <input formControlName="name" id="titulo" type="text" pInputText placeholder="Título"
                        class="p-fluid w-full" />
                </div>
                <div class="field">
                    <label for="valor">Valor</label>
                    <p-inputNumber class="p-fluid w-full" formControlName="amount" id="valor" inputId="currency-us"
                        mode="currency" currency="BRL" locale="pt-BR" />

                </div>
                <div class="field">
                    <label for="tipo-transacao">Tipo Transação</label>
                    <p-dropdown formControlName="type" class="p-fluid" id="tipo-transacao" [options]="getTiposTransacao()"
                        optionLabel="name" optionValue="code" placeholder="Selecione o Tipo de Transação" />
                </div>

                <div class="field" formGroupName="category">
                    <label for="tipo-categoria">Categoria</label>
                    <p-dropdown formControlName="id" class="p-fluid" id="tipo-categoria" [options]="getTiposCategoria()"
                        optionLabel="name" optionValue="code" placeholder="Selecione o Tipo de Categoria" />
                </div>


                <div class="field" formGroupName="paymentMethod">
                    <label for="metodo-pagamento">Método Pagamento</label>
                    <p-dropdown formControlName="id" class="p-fluid" id="metodo-pagamento" [options]="getMetodosPagamento()"
                        optionLabel="name" optionValue="code" placeholder="Selecione o Método de Pagamento" />
                </div>


                <div class="field">
                    <label for="data">Data</label>
                    <p-calendar formControlName="date" class="p-fluid surface-overlay" id="data" appendTo="body"
                        [(ngModel)]="date" [showIcon]="true" dateFormat="dd/mm/yy" placeholder="Data da Transação"
                        inputId="buttondisplay" />
                </div>
            </div>

            <ng-template pTemplate="footer">
                <p-button label="Cancelar" [outlined]="true"
                    (onClick)="closeDialog()" />
                <p-button label="Adicioinar" class="btn-primary"
                    (onClick)="closeDialog(); cadastrar()" />
            </ng-template>
        </p-dialog>
    </div>
</form>
