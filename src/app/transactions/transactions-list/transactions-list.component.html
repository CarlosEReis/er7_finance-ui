<div class="w-full px-7 py-3">
    <div class="flex justify-content-between flex-wrap">
      <div class="flex align-items-center justify-content-center m-2">
        <h1>Transações</h1>
      </div>
      <div class="flex align-items-center justify-content-center m-2">
        <p-button
          label="Adicionar"
          icon="pi pi-sort-alt"
          iconPos="right"
          
        ></p-button>
      </div>
    </div>
  
    <!-- TABELA DE TRANSACOES-->
    <div class="card">
      <p-table [value]="trasanctions" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template pTemplate="header">
          <tr>
            <th>Nome</th>
            <th>Tipo</th>
            <th>Categoria</th>
            <th>Método</th>
            <th>Data</th>
            <th>Valor</th>
            <th class="text-right">Ações</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-transaction>
          <tr>
            <td>{{ transaction.name }}</td>
            <td>
              <p-tag
                [value]="transaction.type"
                [severity]="getTipo(transaction.type)"
              />
            </td>
            <td>{{ getLabelTransactioinCategory(transaction.category.name) }}</td>
            <td> 
                <div
                class="w-2rem h-2rem font-bold p-tag flex align-items-center justify-content-center p-2 border-round mr-3"
                [ngClass]="getStyleClass(transaction.type)"
                pTooltip="{{ getLabelPaymentMethod(transaction.paymentMethod.name) }}">
                <i class="pi p-2" [ngClass]="getIcon(transaction.paymentMethod.name)"
                  style="font-size: 1.2rem"></i>
              </div>
            <td>{{ transaction.date | date: 'dd/MM/yyyy HH:mm' }}</td>
            <td>{{ transaction.amount | currency: 'BRL':'symbol':'1.2-2' }}</td>
            <td class="w-1 text-right">
              <p-button
                size="small"
                icon="pi pi-pencil"
                class="mr-2"
                [rounded]="true"
                [outlined]="true"
                severity="success"
                (onClick)="('#')"
              />
              <p-button
                size="small"
                icon="pi pi-trash"
                severity="danger"
                [rounded]="true"
                [outlined]="true"
                (onClick)="('#')"
              />
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
</div>
