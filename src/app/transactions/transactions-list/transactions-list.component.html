<div class="w-full px-7 py-3">
  <div class="flex justify-content-between flex-wrap">
    <div class="flex align-items-center justify-content-center m-2">
      <h1>Transações</h1>
    </div>
    <div class="flex align-items-center justify-content-center m-2">
      <p-button label="Adicionar" icon="pi pi-sort-alt" iconPos="right" (onClick)="newTransaction()"></p-button>
    </div>
  </div>

  <!-- TABELA DE TRANSACOES-->
  <div class="card">
    <p-table [value]="trasanctions" [tableStyle]="{ 'min-width': '50rem' }">
      <ng-template pTemplate="header">
        <tr>
          <th>Nome</th>
          <th>Tipo</th>
          <th>Categoria</th>
          <th>Método</th>
          <th>Data</th>
          <th>Valor</th>
          <th class="text-right">Ações</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-transaction>
        <tr>
          <td>{{ transaction.name }}</td>
          <td>
            <p-tag [value]="getLabelTransactionType(transaction.type)" [severity]="getTipo(transaction.type)"
              [icon]="transaction.type === 'DEPOSIT' ? 'pi pi-caret-down' : 'pi pi-caret-up'" />
          </td>
          <td>{{ getLabelTransactioinCategory(transaction.category.name) }}</td>
          <td>
            <div
              class="w-2rem h-2rem font-bold p-tag flex align-items-center justify-content-center p-2 border-round mr-3"
              [ngClass]="getStyleClass(transaction.type)"
              pTooltip="{{ getLabelPaymentMethod(transaction.paymentMethod.name) }}">
              <i class="pi p-2" [ngClass]="getIcon(transaction.paymentMethod.name)" style="font-size: 1.2rem"></i>
            </div>
          <td>{{ transaction.date | date: 'dd/MM/yyyy HH:mm' }}</td>
          <td>{{ transaction.amount | currency: 'BRL':'symbol':'1.2-2' }}</td>
          <td class="w-1 text-right">
            <p-button size="small" icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"
              severity="success" (onClick)="newTransaction()" />
            <p-button size="small" icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
              (click)="deleteTransaction()" />
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
<app-transaction-form [dialogVisible]="dialogVisible"
  (dialogState)="closedDialogNewTransaction($event)"></app-transaction-form>

<p-confirmDialog #cd maskStyleClass="blur">
  <ng-template pTemplate="headless" let-message>
    <div class="flex flex-column align-items-center p-5 border-round">
      <div class="border-circle bg-red-500 inline-flex justify-content-center align-items-center h-6rem w-6rem">
        <i class="pi pi-question text-5xl"></i>
      </div>
      <span class="font-bold text-2xl block mb-2 mt-4">
        {{ message.header }}
      </span>
      <p class="mb-0">{{ message.message }}</p>
      <div class="flex align-items-center gap-2 mt-4">
        <button pButton label="Excluir" (click)="cd.accept()" class="w-8rem border-none bg-red-500 text-color">
        </button>
        <button pButton severity="danger" label="Cancelar" (click)="cd.reject()"
          class="p-button-outlined w-8rem text-red-500">
        </button>
      </div>
    </div>
  </ng-template>
</p-confirmDialog>
